[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baldr-router"
version = "0.20.1"
description = "Client-agnostic MCP orchestration runtime with a frozen setup/status/run facade contract, provider adapters, roles, workflows, Context7 cache, telemetry, and structured reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Baldr" }]
dependencies = [
  # Capped deliberately: mcp 2.x renamed FastMCP to MCPServer and changed other
  # APIs, so server.py does not import under it. Without the cap a fresh install
  # resolves 2.x from PyPI and the router fails at startup.
  "mcp>=1.10.0,<3",
  # Versioned contracts are packaged in the wheel and must be enforced at
  # runtime on external payloads, not only in tests.
  "jsonschema>=4.23"
]

[project.scripts]
baldr-router = "baldr_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baldr_router"]

[tool.hatch.build.targets.wheel.force-include]
"src/baldr_router/contracts/facade-v1.json" = "baldr_router/contracts/facade-v1.json"
"src/baldr_router/contracts/facade-v1.schema.json" = "baldr_router/contracts/facade-v1.schema.json"
"src/baldr_router/contracts/work-item-progress-v1.schema.json" = "baldr_router/contracts/work-item-progress-v1.schema.json"
"src/baldr_router/contracts/phase-deliverable-v1.schema.json" = "baldr_router/contracts/phase-deliverable-v1.schema.json"
"src/baldr_router/contracts/phase-deliverable-page-v1.schema.json" = "baldr_router/contracts/phase-deliverable-page-v1.schema.json"
"src/baldr_router/contracts/phase-deliverable-index-page-v1.schema.json" = "baldr_router/contracts/phase-deliverable-index-page-v1.schema.json"
"src/baldr_router/contracts/agent-registry-v1.schema.json" = "baldr_router/contracts/agent-registry-v1.schema.json"
"src/baldr_router/contracts/agent-transport-http-v1.schema.json" = "baldr_router/contracts/agent-transport-http-v1.schema.json"
"src/baldr_router/contracts/agent-manager-v1.schema.json" = "baldr_router/contracts/agent-manager-v1.schema.json"
"src/baldr_router/contracts/agent-source-v1.schema.json" = "baldr_router/contracts/agent-source-v1.schema.json"
"src/baldr_router/contracts/agent-catalog-sync-v1.schema.json" = "baldr_router/contracts/agent-catalog-sync-v1.schema.json"
"src/baldr_router/contracts/agent-team-resolution-v1.schema.json" = "baldr_router/contracts/agent-team-resolution-v1.schema.json"
"src/baldr_router/contracts/orchestration-policy-v1.schema.json" = "baldr_router/contracts/orchestration-policy-v1.schema.json"
"src/baldr_router/contracts/agent-execution-v1.schema.json" = "baldr_router/contracts/agent-execution-v1.schema.json"
"src/baldr_router/console_assets/index.html" = "baldr_router/console_assets/index.html"
"src/baldr_router/console_assets/manifest.webmanifest" = "baldr_router/console_assets/manifest.webmanifest"
"src/baldr_router/console_assets/sw.js" = "baldr_router/console_assets/sw.js"
"src/baldr_router/console_assets/icon-192.png" = "baldr_router/console_assets/icon-192.png"
"src/baldr_router/console_assets/icon-512.png" = "baldr_router/console_assets/icon-512.png"
"src/baldr_router/qualification/profiles-v1.json" = "baldr_router/qualification/profiles-v1.json"
"src/baldr_router/qualification/canaries-v1.json" = "baldr_router/qualification/canaries-v1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/baldr_router"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Baseline for an existing 40k-line core: find real defects without demanding
# annotations everywhere at once. Border modules below are strict.
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false

[[tool.mypy.overrides]]
# Modules that parse or emit data Baldr does not control, plus the security
# primitives. These are checked strictly because a type error here is a
# production defect, not a style issue.
module = [
  "baldr_router.contract_schemas",
  "baldr_router.secrets",
  "baldr_router.redaction",
  "baldr_router.provider_errors",
  "baldr_router.agent_api",
  "baldr_router.agent_http",
  "baldr_router.release_policy",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

[project.optional-dependencies]
codex-sdk = ["openai-codex"]
dev = [
  "baldr-agent-runner>=0.20.1,<0.21.0",
  "baldr-agent-sdk>=0.20.1,<0.21.0",
  "coverage[toml]>=7.6",
  # quality-baselines.json records a zero-error mypy budget and a coverage
  # floor measured with these tools. A linter or checker that enables new rules
  # in a minor release fails the gate without the code changing, so the upper
  # bounds make a tooling upgrade a deliberate, reviewed step.
  "mypy>=1.13,<2.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9,<0.16",
]

[tool.uv.sources]
baldr-agent-runner = { workspace = true }
baldr-agent-sdk = { workspace = true }
