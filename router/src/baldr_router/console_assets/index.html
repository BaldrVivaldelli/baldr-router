<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14171a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>Baldr</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --line: #dfe3e8;
  --ink: #1b1f24;
  --muted: #5c6773;
  --accent: #3d5afe;
  --running: #0b72d4;
  --done: #1f8a4c;
  --attention: #b26a00;
  --stopped: #8a1f1f;
  --idle: #8b95a1;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a;
    --panel: #1c2024;
    --line: #2c3238;
    --ink: #e8eaed;
    --muted: #9aa5b1;
    --accent: #8c9eff;
    --running: #4ea3f0;
    --done: #56c07f;
    --attention: #e0a145;
    --stopped: #e07a7a;
    --idle: #7b848f;
  }
}
* { box-sizing: border-box; }
/* An author `display` beats the user agent's [hidden] rule, so a grid or flex
   container would stay visible while marked hidden. Making it authoritative
   once is what keeps every future container from repeating that bug. */
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
  padding: 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; }
h3 { font-size: 14px; margin: 0 0 6px; }
.scope { color: var(--muted); font-size: 13px; }
select.picker {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; max-width: 46vw;
}
select.picker:hover { border-color: var(--accent); }
.counts { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.pill {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; font-size: 12px; color: var(--muted); white-space: nowrap;
}
.pill b { color: var(--ink); font-weight: 600; }
main { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 16px; padding: 16px; align-items: start; }
#view-settings, #view-agents { grid-template-columns: minmax(0, 760px); }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } header { padding: 12px 16px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
ul.items button {
  width: 100%; text-align: left; background: transparent; color: inherit;
  border: 1px solid transparent; border-radius: 8px; padding: 9px 10px; cursor: pointer; font: inherit;
}
ul.items button:hover { border-color: var(--line); }
ul.items button[aria-current="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.row { display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
.dot.running { background: var(--running); animation: pulse 1.4s ease-in-out infinite; }
.dot.complete { background: var(--done); }
.dot.attention { background: var(--attention); }
.dot.cancelled, .dot.archived { background: var(--stopped); }
@keyframes pulse { 50% { opacity: .35; } }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attention-card {
  border: 1px solid var(--attention); border-left-width: 4px; border-radius: var(--radius);
  background: color-mix(in srgb, var(--attention) 10%, transparent);
  padding: 14px; margin-bottom: 16px;
}
.attention-card h3 { color: var(--attention); }
.waiting { font-size: 12px; color: var(--muted); margin-top: 10px; }
.stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 620px) { .stages { grid-template-columns: 1fr; } }
.stage { border: 1px solid var(--line); border-radius: 8px; padding: 11px; border-top: 3px solid var(--idle); }
.stage.running { border-top-color: var(--running); }
.stage.complete { border-top-color: var(--done); }
.stage.attention { border-top-color: var(--attention); }
.stage.cancelled, .stage.skipped { border-top-color: var(--stopped); }
.stage .name { font-weight: 600; font-size: 13px; text-transform: capitalize; }
.stage .state { font-size: 12px; color: var(--muted); }
.stage p { margin: 8px 0 0; font-size: 13px; }
.activity { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
ol.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
ol.timeline li { position: relative; padding: 0 0 12px 12px; font-size: 13px; }
ol.timeline li::before {
  content: ""; position: absolute; left: -21px; top: 6px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--idle); border: 2px solid var(--panel);
}
ol.timeline li.complete::before { background: var(--done); }
ol.timeline li.running::before { background: var(--running); }
ol.timeline li.attention::before { background: var(--attention); }
ol.timeline time { display: block; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.report dt { font-size: 12px; color: var(--muted); margin-top: 10px; }
.report dd { margin: 3px 0 0; font-size: 13px; }
.report ul { margin: 3px 0 0; padding-left: 18px; font-size: 13px; }
.empty { color: var(--muted); font-size: 13px; }
.section + .section { margin-top: 18px; }
.foot { padding: 0 16px 20px; color: var(--muted); font-size: 12px; }
.stale { color: var(--attention); }
button.ghost {
  background: transparent; color: var(--muted); font: inherit; font-size: 12px;
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer;
}
button.ghost:hover { color: var(--ink); border-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions button {
  font: inherit; font-size: 13px; cursor: pointer; border-radius: 8px;
  padding: 7px 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
.actions button:hover:not(:disabled) { border-color: var(--accent); }
.actions button:disabled { opacity: .5; cursor: progress; }
.actions button.danger { border-color: var(--stopped); color: var(--stopped); }
.action-error { margin-top: 10px; font-size: 13px; color: var(--stopped); }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button {
  font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--muted);
  border: 0; border-bottom: 2px solid transparent; padding: 4px 10px;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.option-group + .option-group { margin-top: 20px; }
.option-group h3 { font-size: 13px; margin-bottom: 2px; }
.option-group > p { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
.option { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.option + .option { margin-top: 6px; }
.option:hover { border-color: var(--accent); }
.option[data-selected="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.option input { margin-top: 3px; }
.option .label { font-weight: 600; font-size: 13px; }
.option .desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
.option .flag { font-size: 11px; color: var(--accent); margin-left: 6px; font-weight: 600; }
.option .flag.warn { color: var(--attention); }
.phase { border: 1px solid var(--line); border-radius: 8px; padding: 11px; }
.phase + .phase { margin-top: 8px; }
.phase h4 { margin: 0; font-size: 13px; }
.phase .role-desc { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.phase input.filter { margin-bottom: 2px; }
.phase select {
  font: inherit; font-size: 13px; width: 100%; padding: 6px 8px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
}
.phase select:focus { outline: none; border-color: var(--accent); }
.phase .field { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
.fallbacks { display: flex; flex-wrap: wrap; gap: 12px; }
.fallbacks label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.notice {
  border-left: 3px solid var(--attention); border-radius: 0 6px 6px 0;
  background: color-mix(in srgb, var(--attention) 8%, transparent);
  padding: 8px 10px; margin: 0 0 10px; font-size: 12px;
}
.stale-router { margin: 16px 16px -4px; font-size: 13px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 620px) { .field-row { grid-template-columns: 1fr; } }
textarea.field-input {
  width: 100%; font: inherit; font-size: 13px; resize: vertical; min-height: 60px;
  padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink);
}
textarea.field-input:focus { outline: none; border-color: var(--accent); }
pre.block {
  margin: 8px 0 0; padding: 11px; overflow-x: auto; font-size: 12px; line-height: 1.5;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  white-space: pre; color: var(--ink);
}
.verdict { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.verdict .tag {
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px;
}
.verdict .tag.yes { border-color: var(--done); color: var(--done); }
.verdict .tag.no { border-color: var(--idle); color: var(--muted); }
.verdict .tag.warn { border-color: var(--attention); color: var(--attention); }
.composer { display: flex; gap: 8px; align-items: flex-end; margin-top: 14px; }
.composer textarea {
  flex: 1; font: inherit; font-size: 14px; resize: vertical; min-height: 44px;
  padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink);
}
.composer textarea:focus { outline: none; border-color: var(--accent); }
.composer button {
  font: inherit; font-size: 13px; cursor: pointer; border-radius: 8px; padding: 10px 16px;
  border: 1px solid var(--accent); background: var(--accent); color: #fff; white-space: nowrap;
}
.composer button:disabled { opacity: .55; cursor: progress; }
.composer-hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.attach { margin-top: 10px; }
.attach-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.attach-bar + .attach-bar { margin-top: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px;
  font-size: 12px; background: var(--bg);
}
.chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font: inherit; line-height: 1; padding: 2px 6px; border-radius: 999px;
}
.chip button:hover { color: var(--stopped); }
.picker-panel {
  margin-top: 8px; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px; background: var(--bg);
}
.picker-panel input.filter {
  width: 100%; font: inherit; font-size: 13px; padding: 7px 9px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink);
}
.picker-panel input.filter:focus { outline: none; border-color: var(--accent); }
ul.entries { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
ul.entries label {
  display: flex; gap: 8px; align-items: baseline; width: 100%;
  padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13px;
}
ul.entries label:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
ul.entries .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.entries .path.dir { font-weight: 600; }
ul.entries .meta { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; padding-left: 8px; }
.action-hint { margin-top: 8px; font-size: 12px; color: var(--muted); }
.locked { max-width: 640px; margin: 48px auto; }
.locked code {
  display: block; margin-top: 10px; padding: 10px; overflow-x: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 12px;
}
</style>
</head>
<body>
<header>
  <h1>Baldr</h1>
  <span class="scope" id="scope"></span>
  <select class="picker" id="workspace" aria-label="Workspace" hidden></select>
  <div class="counts" id="counts"></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-view="tasks" aria-selected="true">Tareas</button>
    <button type="button" role="tab" data-view="settings" aria-selected="false">Configuración</button>
    <button type="button" role="tab" data-view="agents" aria-selected="false">Agentes</button>
  </nav>
  <button class="ghost" id="notify" type="button" hidden>Avisarme</button>
</header>
<p class="notice stale-router" id="stale-router" hidden></p>
<main id="view-tasks">
  <section class="panel" aria-label="Work items">
    <h2>Tareas</h2>
    <ul class="items" id="items"></ul>
    <p class="empty" id="items-empty" hidden>Todavía no hay tareas en este alcance.</p>
    <div id="new-task"></div>
  </section>
  <section id="detail" aria-live="polite"></section>
</main>
<main id="view-settings" hidden>
  <section class="panel" id="settings" aria-label="Configuración"></section>
</main>
<main id="view-agents" hidden>
  <section class="panel" id="agents-page" aria-label="Agentes"></section>
</main>
<p class="foot" id="foot"></p>
<script>
'use strict';
const REFRESH_MS = 3000;
const STAGE_NAMES = { planning: 'Planificación', execution: 'Ejecución', review: 'Revisión' };
const STATE_NAMES = {
  pending: 'en espera', running: 'trabajando', complete: 'listo',
  attention: 'necesita una decisión', cancelled: 'cancelado',
  skipped: 'omitido', archived: 'archivado',
};

const TOKEN_HEADER = 'X-Baldr-Console-Token';
const TOKEN_KEY = 'baldr.console.token';

// The command prints the token in the URL fragment, which the browser never
// sends to a server and never writes to a log. Read it once, keep it in memory
// for this tab, and clear it from the address bar so a screenshot or a pasted
// link does not carry the session.
function claimToken() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const supplied = hash.get('token');
  if (supplied) {
    try { sessionStorage.setItem(TOKEN_KEY, supplied); } catch (_) { /* private mode */ }
    history.replaceState(null, '', location.pathname + location.search);
    return supplied;
  }
  try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (_) { return ''; }
}

let token = claimToken();
let selectedId = new URLSearchParams(location.search).get('work_item_id') || null;
let timer = null;
let lastStates = new Map();
let notified = false;
let lastWorkbench = null;
let context7State = null;
let workspaceState = null;
let canCompose = false;
let workspaceRoot = new URLSearchParams(location.search).get('workspace_root') || '';
const drafts = new Map();

// A task points at context; it never carries file content. The selection and
// the picker's own state live out here for the same reason an unsent draft
// does: the view re-renders, and neither should vanish mid-decision.
const attachments = new Map();
const pickerState = new Map();
const ENTRY_ROWS = 200;
let contextListing = null;
let contextError = '';
let contextLoading = false;
let agentsState = null;
let agentsError = '';
let agentsLoading = false;
let providersState = null;
let providersError = '';
let providersLoading = false;
// Which profile the editor is open on: a name to edit, '' for a new one, or
// null for closed. Out here because the settings panel re-renders.
let editingProfile = null;

const sizeLabel = (value) => {
  if (!Number.isFinite(value)) return '';
  if (value < 1024) return value + ' B';
  if (value < 1024 * 1024) return Math.round(value / 1024) + ' KB';
  return (value / (1024 * 1024)).toFixed(1) + ' MB';
};

const maxAttachments = () => (contextListing && contextListing.max_attachments) || 25;

// Fetched when the configuration tab opens, never with the polled view:
// building the catalog can call a remote agent manager with a timeout of its
// own, and a three-second refresh must not wait on that.
async function loadAgents(force) {
  if (agentsLoading) return;
  if (!force && agentsState) return;
  agentsLoading = true;
  agentsError = '';
  try {
    const response = await fetch(new URL('/v1/agents', location.origin), {
      headers: { Accept: 'application/json', [TOKEN_HEADER]: token },
      credentials: 'omit',
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      agentsError = (payload.error && payload.error.message) || ('HTTP ' + response.status);
      agentsState = null;
    } else {
      agentsState = payload;
    }
  } catch (error) {
    agentsError = error.message;
    agentsState = null;
  } finally {
    agentsLoading = false;
  }
}

// Also off the polled view: listing Codex's models opens an app-server
// session, and each adapter's status shells out to its CLI.
async function loadProviders(force) {
  if (providersLoading) return;
  if (!force && providersState) return;
  providersLoading = true;
  providersError = '';
  try {
    const response = await fetch(new URL('/v1/providers', location.origin), {
      headers: { Accept: 'application/json', [TOKEN_HEADER]: token },
      credentials: 'omit',
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      providersError = (payload.error && payload.error.message) || ('HTTP ' + response.status);
      providersState = null;
    } else {
      providersState = payload;
    }
  } catch (error) {
    providersError = error.message;
    providersState = null;
  } finally {
    providersLoading = false;
  }
}

// Fetched when a picker first opens rather than with the view: enumerating a
// repository costs a Git call, and most visits never attach anything.
async function loadContext(force) {
  if (!workspaceRoot) return;
  if (contextLoading) return;
  if (!force && contextListing && contextListing.root === workspaceRoot) return;
  contextLoading = true;
  contextError = '';
  try {
    const url = new URL('/v1/context', location.origin);
    url.searchParams.set('workspace_root', workspaceRoot);
    const response = await fetch(url, {
      headers: { Accept: 'application/json', [TOKEN_HEADER]: token },
      credentials: 'omit',
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || payload.ok === false) {
      contextError = (payload.error && payload.error.message) || ('HTTP ' + response.status);
      contextListing = null;
    } else {
      contextListing = { ...payload, root: workspaceRoot };
    }
  } catch (error) {
    contextError = error.message;
    contextListing = null;
  } finally {
    contextLoading = false;
  }
}

// Every write names the workspace it acts on; the router matches it against the
// list it published and refuses anything else.
const scoped = (body) => (workspaceRoot ? { ...body, workspace_root: workspaceRoot } : body);

function renderWorkspaces(workspaces, locked) {
  const picker = document.getElementById('workspace');
  if (locked) {
    // Started for one repository on purpose; offering a switch would lie.
    picker.hidden = true;
    return;
  }
  picker.hidden = false;
  const signature = JSON.stringify([workspaces, workspaceRoot]);
  if (picker.dataset.signature === signature) return;
  picker.dataset.signature = signature;
  picker.replaceChildren();
  picker.append(el('option', { value: '', text: workspaces.length ? 'Todas las tareas' : 'Sin workspaces conocidos' }));
  for (const workspace of workspaces) {
    picker.append(el('option', {
      value: workspace.root,
      text: workspace.trusted ? workspace.label : `${workspace.label} (sin confiar)`,
      title: workspace.root,
    }));
  }
  picker.value = workspaceRoot;
}

const el = (tag, props = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (value !== null && value !== undefined) node.setAttribute(key, value);
  }
  for (const child of children) if (child) node.append(child);
  return node;
};

const when = (value) => {
  if (!value) return '';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '' : date.toLocaleString();
};

const ago = (value) => {
  if (!value) return '';
  const seconds = Math.round((Date.now() - new Date(value).getTime()) / 1000);
  if (!Number.isFinite(seconds)) return '';
  if (seconds < 60) return 'hace instantes';
  if (seconds < 3600) return `hace ${Math.floor(seconds / 60)} min`;
  if (seconds < 86400) return `hace ${Math.floor(seconds / 3600)} h`;
  return `hace ${Math.floor(seconds / 86400)} d`;
};

function renderCounts(counts, total) {
  const box = document.getElementById('counts');
  box.replaceChildren();
  const entries = Object.entries(counts || {});
  if (!entries.length) return;
  box.append(el('span', { class: 'pill' }, [el('b', { text: String(total || 0) }), document.createTextNode(' en total')]));
  for (const [status, count] of entries.sort((a, b) => a[0].localeCompare(b[0]))) {
    box.append(el('span', { class: 'pill' }, [el('b', { text: String(count) }), document.createTextNode(' ' + status)]));
  }
}

function renderItems(items) {
  const list = document.getElementById('items');
  const empty = document.getElementById('items-empty');
  list.replaceChildren();
  empty.hidden = items.length > 0;
  for (const item of items) {
    const progress = item.progress_summary || {};
    const state = progress.overall_state || item.status || 'pending';
    const button = el('button', { type: 'button', 'aria-current': String(item.id === selectedId) }, [
      el('div', { class: 'row' }, [
        el('span', { class: 'dot ' + state }),
        el('span', { class: 'title', text: item.title || item.id }),
      ]),
      el('div', { class: 'sub', text: progress.activity || STATE_NAMES[state] || state }),
      el('div', { class: 'sub', text: ago(progress.last_event_at || item.updated_at) }),
    ]);
    button.addEventListener('click', () => {
      selectedId = item.id;
      const url = new URL(location.href);
      url.searchParams.set('work_item_id', item.id);
      history.replaceState(null, '', url);
      refresh();
    });
    list.append(el('li', {}, [button]));
  }
}

// These change or discard work that cannot be recovered by repeating them, so
// each one asks first.
const CONFIRM_ACTIONS = new Set([
  'decline_changes', 'discard_shadow', 'discard_worktree', 'mark_failed', 'cancel',
]);

async function submitAction(itemId, action, label, button) {
  if (CONFIRM_ACTIONS.has(action) && !confirm(`¿Confirmás «${label}»?`)) return;
  const card = button.closest('.attention-card, .panel');
  const previous = card ? card.querySelector('.action-error') : null;
  if (previous) previous.remove();
  const buttons = card ? card.querySelectorAll('.actions button') : [button];
  buttons.forEach((b) => { b.disabled = true; });
  try {
    const response = await fetch(new URL('/v1/actions', location.origin), {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'application/json', [TOKEN_HEADER]: token },
      body: JSON.stringify(scoped({ work_item_id: itemId, action })),
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || payload.ok === false) {
      const detail = (payload.error && payload.error.message) || ('HTTP ' + response.status);
      if (card) card.append(el('div', { class: 'action-error', text: 'No se pudo aplicar: ' + detail }));
      buttons.forEach((b) => { b.disabled = false; });
      return;
    }
    await refresh();
  } catch (error) {
    if (card) card.append(el('div', { class: 'action-error', text: 'No se pudo aplicar: ' + error.message }));
    buttons.forEach((b) => { b.disabled = false; });
  }
}

function actionButtons(itemId, actions, allowed) {
  const box = el('div', { class: 'actions' });
  for (const action of actions) {
    // The router decides what is legal; the page only renders what it says.
    if (!allowed.includes(action.id)) continue;
    const label = action.label || action.id;
    const button = el('button', {
      type: 'button',
      class: CONFIRM_ACTIONS.has(action.id) ? 'danger' : '',
      title: action.description || '',
      text: label,
    });
    button.addEventListener('click', () => submitAction(itemId, action.id, label, button));
    box.append(button);
  }
  return box.childElementCount ? box : null;
}

function renderAttention(itemId, attention, allowed) {
  if (!attention || !attention.required) return null;
  const card = el('div', { class: 'attention-card' }, [
    el('h3', { text: 'Baldr necesita una decisión' }),
    el('div', { text: attention.summary || 'Hay una decisión pendiente.' }),
  ]);
  const blockers = (attention.blockers || []).filter(Boolean);
  if (blockers.length) {
    card.append(el('ul', {}, blockers.map((text) => el('li', { text }))));
  }
  const buttons = actionButtons(itemId, attention.actions || [], allowed);
  if (buttons) {
    card.append(buttons);
  } else {
    card.append(el('div', {
      class: 'waiting',
      text: 'Respondé desde la consola de VS Code o con baldr-router facade run.',
    }));
  }
  return card;
}

function renderStages(stages) {
  const box = el('div', { class: 'stages' });
  for (const stage of stages || []) {
    const state = stage.state || 'pending';
    const card = el('div', { class: 'stage ' + state }, [
      el('div', { class: 'name', text: STAGE_NAMES[stage.id] || stage.id }),
      el('div', { class: 'state', text: STATE_NAMES[state] || state }),
    ]);
    if (stage.round_count > 1) {
      card.append(el('div', { class: 'state', text: `${stage.round_count} rondas` }));
    }
    const summary = stage.report && stage.report.summary;
    if (summary) card.append(el('p', { text: summary }));
    if (stage.outcome) card.append(el('div', { class: 'state', text: 'resultado: ' + stage.outcome }));
    box.append(card);
  }
  return box;
}

function renderMilestones(milestones) {
  const list = el('ol', { class: 'timeline' });
  for (const milestone of (milestones || []).slice().reverse()) {
    if (!milestone || !milestone.message) continue;
    list.append(el('li', { class: milestone.state || '' }, [
      document.createTextNode(milestone.message),
      el('time', { text: [STAGE_NAMES[milestone.stage] || milestone.stage, when(milestone.at)].filter(Boolean).join(' · ') }),
    ]));
  }
  return list.childElementCount ? list : null;
}

const REPORT_FIELDS = [
  ['summary', 'Resumen'],
  ['interpretation', 'Qué entendió'],
  ['work_completed', 'Qué hizo'],
  ['findings', 'Hallazgos'],
  ['verification_evidence', 'Qué comprobó'],
  ['files_modified', 'Archivos modificados'],
  ['files_added', 'Archivos nuevos'],
  ['follow_up', 'Pendiente'],
];

function renderReport(report) {
  if (!report) return null;
  const list = el('dl', { class: 'report' });
  for (const [key, label] of REPORT_FIELDS) {
    const value = report[key];
    if (!value || (Array.isArray(value) && !value.length)) continue;
    list.append(el('dt', { text: label }));
    if (Array.isArray(value)) {
      list.append(el('dd', {}, [el('ul', {}, value.filter(Boolean).map((v) => el('li', { text: String(v) })))]));
    } else {
      list.append(el('dd', { text: String(value) }));
    }
  }
  return list.childElementCount ? list : null;
}

function renderDetail(selected, selectedError) {
  const host = document.getElementById('detail');
  // The view polls, and rebuilding identical state would take the caret out of
  // a half-written follow-up and close an open context picker every few
  // seconds. A rebuild happens when something actually changed.
  const signature = JSON.stringify([selected, selectedError, canCompose]);
  if (host.dataset.signature === signature) return;
  host.dataset.signature = signature;
  host.replaceChildren();
  if (selectedError) {
    host.append(el('div', { class: 'panel' }, [el('p', { class: 'empty', text: 'No se encontró esa tarea en este alcance.' })]));
    return;
  }
  if (!selected) {
    host.append(el('div', { class: 'panel' }, [el('p', { class: 'empty', text: 'Elegí una tarea para ver qué está haciendo Baldr.' })]));
    return;
  }
  const progress = selected.progress || {};
  const panel = el('div', { class: 'panel' });
  panel.append(el('h3', { text: selected.title || selected.id }));
  if (selected.task) panel.append(el('p', { class: 'sub', style: 'white-space:normal', text: selected.task }));

  const allowed = selected.allowed_actions || [];
  const attention = renderAttention(selected.id, progress.attention, allowed);
  if (attention) panel.append(attention);

  if (allowed.includes('cancel')) {
    const stop = actionButtons(selected.id, [
      { id: 'cancel', label: 'Detener', description: 'Cancela esta ejecución y limpia sus procesos.' },
    ], allowed);
    if (stop) panel.append(stop);
  }

  const activity = progress.activity || {};
  if (activity.message) {
    panel.append(el('div', { class: 'activity' }, [
      el('span', { class: 'dot ' + (activity.state || progress.overall_state || '') }),
      el('span', { text: activity.message }),
      el('span', { text: ago(activity.since) }),
    ]));
  }

  panel.append(el('div', { class: 'section' }, [el('h2', { text: 'Fases' }), renderStages(progress.stages)]));

  const milestones = renderMilestones(progress.milestones);
  if (milestones) {
    panel.append(el('div', { class: 'section' }, [el('h2', { text: 'Qué pasó' }), milestones]));
  }

  const report = renderReport(progress.final_report);
  if (report) {
    panel.append(el('div', { class: 'section' }, [el('h2', { text: 'Resultado' }), report]));
  }

  // Continuing is offered once the item is no longer working, because a turn
  // is a follow-up to a result, not an interruption.
  if (canCompose && ['complete', 'attention', 'cancelled'].includes(progress.overall_state)) {
    panel.append(el('div', { class: 'section' }, [
      el('h2', { text: 'Seguir esta tarea' }),
      composer({
        itemId: selected.id,
        placeholder: 'Pedile una corrección o el próximo paso…',
        submitLabel: 'Continuar',
        hint: 'Se agrega como un turno de esta misma tarea, conservando su historia.',
      }),
    ]));
  }
  host.append(panel);
}

function renderLocked() {
  document.getElementById('counts').replaceChildren();
  document.getElementById('items').replaceChildren();
  document.getElementById('items-empty').hidden = true;
  const host = document.getElementById('detail');
  host.replaceChildren(el('div', { class: 'panel locked' }, [
    el('h3', { text: 'Falta el token de esta sesión' }),
    el('p', { class: 'empty', text: 'La consola no guarda credenciales en el navegador: el token viaja en el enlace que imprime el comando y vive solo en esta pestaña. Abrí ese enlace, o fijá uno estable:' }),
    el('code', { text: 'BALDR_CONSOLE_TOKEN=tu-token baldr-router console' }),
  ]));
}

function announce(items) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  for (const item of items) {
    const state = (item.progress_summary || {}).overall_state || item.status;
    const previous = lastStates.get(item.id);
    lastStates.set(item.id, state);
    if (!previous || previous === state) continue;
    // Only the two transitions worth interrupting someone for.
    if (state === 'attention') {
      new Notification('Baldr necesita una decisión', { body: item.title || item.id, tag: item.id });
    } else if (state === 'complete' && previous === 'running') {
      new Notification('Baldr terminó', { body: item.title || item.id, tag: item.id });
    }
  }
}

// Field -> the options key that lists its legal values, with the heading the
// VS Code console already uses for the same choice.
const SETTINGS_GROUPS = [
  ['safety_mode', 'safety_modes', 'Protección de cambios', 'Cuánto te pregunta Baldr antes de tocar el repositorio.'],
  ['preset', 'presets', 'Nivel de detalle', 'Cuánto análisis dedica a cada tarea.'],
  ['context_mode', 'context_modes', 'Ayuda adicional', 'Si consulta documentación externa con Context7.'],
  ['team_mode', 'team_modes', 'Equipo', 'Cómo elige qué agente cubre cada fase.'],
];

// The modes describe themselves; what was missing is the tree they apply to.
// Every mode the console offers writes into this directory rather than a copy,
// so uncommitted work and a missing repository are consequences, not trivia.
function safetyNote(preferences) {
  const state = workspaceState;
  if (!state) return null;
  const mode = preferences.safety_mode;
  const box = el('div', {});
  let problem = '';
  if (!state.is_git_repository && mode === 'current') {
    problem = 'Esta carpeta no es un repositorio Git, y «Trabajar directamente» lo exige: la tarea va a ser rechazada. '
      + 'Inicializá Git, o elegí «Sin protección» si de verdad querés trabajar sin él.';
  } else if (!state.is_git_repository && mode === 'automatic') {
    problem = 'Esta carpeta no es un repositorio Git. Baldr va a pedirte autorización antes de escribir, '
      + 'pero no vas a tener un diff con el que revisar lo que hizo.';
  } else if (mode === 'non-git') {
    problem = 'Sin protección: Baldr escribe directo y, si una tarea se interrumpe, no hay copia para restaurar.';
  } else if (state.dirty) {
    const count = state.uncommitted_files;
    problem = `Tenés ${count} archivo${count === 1 ? '' : 's'} modificado${count === 1 ? '' : 's'} sin confirmar. `
      + 'Baldr escribe sobre esta misma carpeta, así que sus cambios van a quedar mezclados con los tuyos. '
      + 'Confirmá o guardá lo tuyo antes de arrancar.';
  }
  if (problem) box.append(el('p', { class: 'notice', text: problem }));
  const facts = [
    state.is_git_repository
      ? `Repositorio Git${state.branch ? ' en ' + state.branch : ''}`
      : 'Sin repositorio Git',
    state.is_git_repository
      ? (state.dirty ? `${state.uncommitted_files} sin confirmar` : 'sin cambios pendientes')
      : '',
    state.trusted ? 'workspace de confianza' : 'workspace sin confiar',
  ].filter(Boolean);
  box.append(el('p', { class: 'action-hint', text: facts.join(' · ') + '.' }));
  // Worth stating once: none of these three works in a copy.
  box.append(el('p', {
    class: 'action-hint',
    text: 'Las tres opciones escriben sobre esta carpeta. Lo que cambia es si Baldr te pide autorización antes, y si exige Git.',
  }));
  return box;
}

// Choosing a documentation mode says what you want; whether anything happens
// depends on a key and a router mode the page does not own. Without this the
// choice looks applied and silently does nothing, which is the worst of both.
function context7Note(preferences) {
  const state = context7State;
  if (!state) return null;
  const mode = preferences.context_mode;
  const box = el('div', {});
  let problem = '';
  if (mode === 'on' && !state.api_key_available) {
    problem = 'Elegiste «Ayuda activa», pero no hay API key. La tarea corre igual y sin documentación: no falla, simplemente no consulta.';
  } else if (mode === 'on' && !state.injects_documentation) {
    problem = `El router está en modo «${state.mode}», que no inyecta documentación en la tarea.`;
  } else if (mode === 'auto' && !state.enabled) {
    problem = 'Context7 está apagado en el router, así que «Ayuda automática» no consulta nada.';
  } else if (mode === 'auto' && !state.api_key_available) {
    problem = 'Context7 está activo en el router, pero no encuentra la API key, así que no va a consultar nada.';
  }
  if (problem) {
    box.append(el('p', { class: 'notice', text: problem }));
    box.append(el('p', {
      class: 'action-hint',
      text: 'Se configura desde la terminal, nunca pegando la key acá: baldr-router setup-context7 --mode hybrid',
    }));
  }
  box.append(el('p', {
    class: 'action-hint',
    text: `Context7 ${state.enabled ? 'activo' : 'apagado'} en el router · modo ${state.mode} · `
      + `key ${state.api_key_available ? 'disponible' : 'no disponible'} (${state.api_key_source}).`,
  }));
  return box;
}

// Every phase runs its profiles in order until one succeeds, so the primary is
// simply the first. The router replaces the whole map rather than merging, so a
// save always names all three phases.
const PHASES = [
  ['architect', 'Planificación', 'Entiende el pedido, arma el plan y define qué hay que verificar.'],
  ['implementer', 'Ejecución', 'Escribe el código y corre las verificaciones del plan.'],
  ['reviewer', 'Revisión', 'Lee el diff contra el plan y marca lo que bloquea.'],
];

function reportSaveError(detail) {
  // Rendered first and then annotated: re-rendering afterwards would clear the
  // very message that explains why the control snapped back.
  renderSettings(lastWorkbench, true);
  document.getElementById('settings').append(el('div', {
    class: 'action-error', id: 'settings-error', text: 'No se pudo guardar: ' + detail,
  }));
}

async function postPreferences(body, group) {
  const error = document.getElementById('settings-error');
  if (error) error.remove();
  if (group) group.querySelectorAll('input, select').forEach((i) => { i.disabled = true; });
  try {
    const response = await fetch(new URL('/v1/preferences', location.origin), {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'application/json', [TOKEN_HEADER]: token },
      body: JSON.stringify(scoped(body)),
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || payload.ok === false) {
      reportSaveError((payload.error && payload.error.message) || ('HTTP ' + response.status));
      return;
    }
    await refresh();
  } catch (err) {
    reportSaveError(err.message);
  }
}

async function savePreference(field, value, option, group) {
  if (option.requires_confirmation
      && !confirm(`«${option.label}» quita la protección de Git. ¿Confirmás?`)) {
    renderSettings(lastWorkbench, true);
    return;
  }
  await postPreferences(
    { [field]: value, allow_non_git: Boolean(option.requires_confirmation) },
    group,
  );
}

function profileLabel(name, profile) {
  const parts = [profile.provider, profile.model, profile.agent].filter(Boolean);
  return parts.length ? `${name} · ${parts.join(' · ')}` : name;
}

// The per-phase team, which is what the "A medida" preset has always meant and
// never showed. Rendered only when there is a choice to make.
function renderPhases(host, workbench) {
  const preferences = workbench.preferences || {};
  const catalog = (workbench.profiles && workbench.profiles.execution_profiles) || {};
  const names = Object.keys(catalog).filter((name) => catalog[name].enabled !== false);
  if (!names.length) return;

  const group = el('div', { class: 'option-group' }, [
    el('h3', { text: 'Equipo por etapa' }),
    el('p', { text: 'Qué configuración de agente cubre cada etapa, y a qué recurre si falla.' }),
  ]);

  if (names.length === 1) {
    group.append(el('p', {
      class: 'action-hint',
      text: `Hay una sola configuración definida («${names[0]}»), así que cubre las tres etapas. `
        + 'Para elegir entre varias, definilas en config.toml.',
    }));
    host.append(group);
    return;
  }

  // The preset overwrites what these profiles say about effort, so choosing here
  // without knowing that would look like the choice was ignored.
  const preset = preferences.preset;
  if (preset && preset !== 'custom') {
    const consequence = preset === 'fast'
      ? 'El nivel «Rápido» corre sólo el perfil principal de cada etapa y le fija el esfuerzo más bajo.'
      : 'El nivel de detalle elegido le fija el esfuerzo a todas las etapas, por encima de lo que diga cada perfil.';
    group.append(el('p', {
      class: 'notice',
      text: `${consequence} Para que manden estos perfiles, elegí «A medida» en Nivel de detalle.`,
    }));
  }

  // The draft holds all three phases because a save replaces all three.
  const draft = {};
  for (const [role] of PHASES) {
    const stored = (preferences.role_profiles || {})[role] || [];
    const kept = stored.filter((name) => names.includes(name));
    draft[role] = kept.length ? kept : [names[0]];
  }

  for (const [role, title, description] of PHASES) {
    const card = el('div', { class: 'phase' }, [
      el('h4', { text: title }),
      el('p', { class: 'role-desc', text: description }),
    ]);
    const primary = draft[role][0];

    const select = el('select', { 'aria-label': `Configuración principal de ${title}` });
    for (const name of names) {
      select.append(el('option', { value: name, text: profileLabel(name, catalog[name]) }));
    }
    select.value = primary;
    select.addEventListener('change', () => {
      const chosen = select.value;
      draft[role] = [chosen, ...draft[role].filter((name) => name !== chosen)];
      postPreferences({ role_profiles: draft }, card);
    });
    card.append(el('label', { class: 'field', text: 'Principal' }), select);

    const detail = catalog[primary] && catalog[primary].description;
    if (detail) card.append(el('p', { class: 'role-desc', text: detail }));

    const others = names.filter((name) => name !== primary);
    if (others.length) {
      const boxes = el('div', { class: 'fallbacks' });
      for (const name of others) {
        const box = el('input', { type: 'checkbox' });
        box.checked = draft[role].includes(name);
        box.addEventListener('change', () => {
          draft[role] = box.checked
            ? [...draft[role], name]
            : draft[role].filter((value) => value !== name);
          postPreferences({ role_profiles: draft }, card);
        });
        boxes.append(el('label', {}, [box, el('span', { text: name })]));
      }
      card.append(
        el('label', { class: 'field', text: 'Si falla, probar también' }),
        boxes,
      );
    }
    group.append(card);
  }
  host.append(group);
}

// Creating a profile is a smaller thing than granting trust or storing a key,
// which is why it belongs here and those do not: the worst a wrong profile does
// is run a phase on the wrong model, and fixing it is another save.
function renderProfiles(host, workbench) {
  const catalog = (workbench.profiles && workbench.profiles.execution_profiles) || {};
  const group = el('div', { class: 'option-group' }, [
    el('h3', { text: 'Modelos y perfiles' }),
    el('p', { text: 'Un perfil es un proveedor con su modelo y su esfuerzo. Las etapas eligen entre estos.' }),
  ]);

  for (const [name, profile] of Object.entries(catalog)) {
    const card = el('div', { class: 'phase' });
    const edit = el('button', { class: 'ghost', type: 'button', text: 'Editar' });
    edit.addEventListener('click', () => {
      editingProfile = name;
      loadProviders(false).then(() => renderSettings(lastWorkbench, true));
      renderSettings(lastWorkbench, true);
    });
    card.append(el('div', { class: 'attach-bar' }, [
      el('h4', { text: name }),
      el('span', { class: 'meta', text: [profile.provider, profile.model, profile.reasoning_effort || profile.effort, profile.agent].filter(Boolean).join(' · ') }),
      edit,
    ]));
    if (profile.description) card.append(el('p', { class: 'role-desc', text: profile.description }));
    if (editingProfile === name) card.append(profileForm(name, profile));
    group.append(card);
  }

  if (editingProfile === '') {
    group.append(el('div', { class: 'phase' }, [
      el('h4', { text: 'Perfil nuevo' }),
      profileForm('', {}),
    ]));
  } else {
    const add = el('button', { class: 'ghost', type: 'button', text: 'Nuevo perfil' });
    add.addEventListener('click', () => {
      editingProfile = '';
      loadProviders(false).then(() => renderSettings(lastWorkbench, true));
      renderSettings(lastWorkbench, true);
    });
    group.append(el('div', { class: 'attach-bar', style: 'margin-top:8px' }, [add]));
  }
  host.append(group);
}

function profileForm(name, profile) {
  const box = el('div', { style: 'margin-top:10px' });
  if (providersError) {
    box.append(el('p', { class: 'action-error', text: 'No se pudo leer los proveedores: ' + providersError }));
    return box;
  }
  if (!providersState) {
    box.append(el('p', { class: 'action-hint', text: 'Leyendo los proveedores…' }));
    return box;
  }
  const providers = providersState.providers || [];
  const nameInput = el('input', { class: 'filter', type: 'text', placeholder: 'nombre-del-perfil', 'aria-label': 'Nombre' });
  nameInput.value = name;
  nameInput.disabled = Boolean(name);

  const providerSelect = el('select', { 'aria-label': 'Proveedor' });
  for (const provider of providers) {
    providerSelect.append(el('option', {
      value: provider.id,
      text: provider.available ? provider.id : `${provider.id} (no disponible)`,
    }));
  }
  providerSelect.value = profile.provider || providersState.default_provider || (providers[0] || {}).id || '';

  // A datalist suggests without forbidding: a model that reached the CLI but
  // not this list must still be usable.
  const listId = 'models-' + (name || 'new');
  const models = el('datalist', { id: listId });
  const modelInput = el('input', { class: 'filter', type: 'text', list: listId, 'aria-label': 'Modelo' });
  modelInput.value = profile.model || '';
  const agentInput = el('input', { class: 'filter', type: 'text', 'aria-label': 'Agente' });
  agentInput.value = profile.agent || '';
  const effortSelect = el('select', { 'aria-label': 'Esfuerzo' });
  const descInput = el('input', { class: 'filter', type: 'text', placeholder: 'Para qué es este perfil', 'aria-label': 'Descripción' });
  descInput.value = profile.description || '';

  const modelRow = el('div', {}, [el('label', { class: 'field', text: 'Modelo' }), modelInput, models]);
  const agentRow = el('div', {}, [el('label', { class: 'field', text: 'Agente' }), agentInput]);
  const effortRow = el('div', {}, [el('label', { class: 'field', text: 'Esfuerzo' }), effortSelect]);
  const note = el('p', { class: 'action-hint' });

  function syncProvider() {
    const chosen = providers.find((p) => p.id === providerSelect.value) || {};
    // Kiro picks a named agent instead of a model, so the form follows.
    const wantsModel = chosen.configures !== 'agent';
    modelRow.hidden = !wantsModel;
    agentRow.hidden = wantsModel;
    models.replaceChildren();
    for (const model of chosen.models || []) {
      models.append(el('option', { value: model.id, label: model.description || model.label || '' }));
    }
    effortSelect.replaceChildren(el('option', { value: '', text: 'Por defecto del proveedor' }));
    for (const effort of chosen.efforts || []) {
      effortSelect.append(el('option', { value: effort, text: effort }));
    }
    effortSelect.value = profile.reasoning_effort || profile.effort || '';
    effortRow.hidden = !(chosen.efforts || []).length;
    const bits = [];
    if (!chosen.available && chosen.reason) bits.push('No disponible: ' + chosen.reason);
    if (chosen.model_source === 'aliases') bits.push('Podés usar un alias o el nombre completo de un modelo.');
    if (chosen.model_source === 'unavailable') bits.push('No se pudo listar los modelos; escribilo a mano.');
    note.textContent = bits.join(' ');
  }
  providerSelect.addEventListener('change', syncProvider);

  const save = el('button', { type: 'button', text: 'Guardar perfil' });
  const cancel = el('button', { class: 'ghost', type: 'button', text: 'Cancelar' });
  cancel.addEventListener('click', () => {
    editingProfile = null;
    renderSettings(lastWorkbench, true);
  });
  save.addEventListener('click', async () => {
    const body = {
      name: nameInput.value.trim(),
      provider: providerSelect.value,
      description: descInput.value.trim(),
    };
    const chosen = providers.find((p) => p.id === providerSelect.value) || {};
    if (chosen.configures === 'agent') body.agent = agentInput.value.trim();
    else {
      body.model = modelInput.value.trim();
      body.reasoning_effort = effortSelect.value;
    }
    const existing = box.querySelector('.action-error');
    if (existing) existing.remove();
    save.disabled = true;
    try {
      const response = await fetch(new URL('/v1/profiles', location.origin), {
        method: 'POST',
        credentials: 'omit',
        headers: { 'Content-Type': 'application/json', [TOKEN_HEADER]: token },
        body: JSON.stringify(body),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.ok === false) {
        box.append(el('div', { class: 'action-error', text: 'No se pudo guardar: '
          + ((payload.error && payload.error.message) || ('HTTP ' + response.status)) }));
        save.disabled = false;
        return;
      }
      editingProfile = null;
      await loadProviders(true);
      await refresh();
    } catch (error) {
      box.append(el('div', { class: 'action-error', text: 'No se pudo guardar: ' + error.message }));
      save.disabled = false;
    }
  });

  box.append(
    el('label', { class: 'field', text: 'Nombre' }), nameInput,
    el('label', { class: 'field', text: 'Proveedor' }), providerSelect,
    modelRow, agentRow, effortRow,
    el('label', { class: 'field', text: 'Descripción' }), descInput,
    note,
    el('div', { class: 'actions' }, [save, cancel]),
  );
  syncProvider();
  return box;
}

// Pinning an agent to a phase. An external agent is a registered version with
// declared capabilities, so the page offers only what the resolver would accept
// and says why it ruled the rest out.
function renderAgents(host, preferences) {
  const group = el('div', { class: 'option-group' }, [
    el('h3', { text: 'Agentes por etapa' }),
    el('p', { text: 'Fijar un agente externo registrado para una etapa, en lugar del proveedor de su perfil.' }),
  ]);
  if (agentsError) {
    group.append(el('p', { class: 'action-error', text: 'No se pudo leer el catálogo: ' + agentsError }));
    host.append(group);
    return;
  }
  if (!agentsState) {
    group.append(el('p', { class: 'action-hint', text: 'Leyendo el catálogo de agentes…' }));
    host.append(group);
    return;
  }
  const state = agentsState;
  if (state.degraded) {
    group.append(el('p', {
      class: 'notice',
      text: 'El agent manager no responde, así que el catálogo está incompleto. '
        + 'Fijar un agente ahora podría nombrar una versión que Baldr todavía no ve.',
    }));
  }
  if (!state.agent_count) {
    group.append(el('p', {
      class: 'action-hint',
      text: 'No hay agentes externos registrados, así que cada etapa la cubre el proveedor de su perfil. '
        + 'Para registrar uno: baldr-router agent publish',
    }));
    host.append(group);
    return;
  }

  // Complete, like the phase team: the stored map is replaced, not merged, and
  // an empty value is how a phase stops being pinned.
  const draft = {};
  for (const [role] of PHASES) draft[role] = (preferences.agent_overrides || {})[role] || '';

  for (const [role, title] of PHASES) {
    const candidates = (state.roles || {})[role] || [];
    const eligible = candidates.filter((candidate) => candidate.eligible);
    const card = el('div', { class: 'phase' }, [el('h4', { text: title })]);
    const select = el('select', { 'aria-label': `Agente para ${title}` });
    select.append(el('option', { value: '', text: 'Sin fijar (usa el perfil de la etapa)' }));
    for (const candidate of eligible) {
      select.append(el('option', {
        value: candidate.ref,
        text: candidate.owner ? `${candidate.ref} · ${candidate.owner}` : candidate.ref,
      }));
    }
    select.value = draft[role];
    select.addEventListener('change', () => {
      draft[role] = select.value;
      postPreferences({ agent_overrides: draft }, card);
    });
    card.append(el('label', { class: 'field', text: 'Agente' }), select);
    if (!eligible.length) {
      card.append(el('p', { class: 'role-desc', text: 'Ningún agente registrado puede cubrir esta etapa.' }));
    }
    // The resolver's own reason, because "not offered" without it is a puzzle.
    for (const candidate of candidates.filter((c) => !c.eligible && c.reason)) {
      card.append(el('p', { class: 'role-desc', text: `${candidate.ref}: ${candidate.reason}` }));
    }
    group.append(card);
  }
  group.append(el('p', {
    class: 'action-hint',
    text: 'Un agente fijado manda incluso con el equipo en «Automático».',
  }));
  host.append(group);
}

function renderSettings(workbench, force) {
  const host = document.getElementById('settings');
  const preferences = (workbench && workbench.preferences) || null;
  const options = (workbench && workbench.options) || {};
  // The view polls, and rebuilding these controls under the pointer would drop
  // a half-made choice every three seconds.
  const signature = JSON.stringify([
    preferences, options, workbench && workbench.profiles,
    context7State, workspaceState, agentsState, agentsError,
    providersState, providersError, editingProfile,
  ]);
  if (!force && host.dataset.signature === signature) return;
  host.dataset.signature = signature;
  host.replaceChildren();
  if (!preferences) {
    host.append(el('p', { class: 'empty', text: 'Elegí un workspace arriba para configurarlo.' }));
    return;
  }
  for (const [field, optionKey, title, description] of SETTINGS_GROUPS) {
    const choices = options[optionKey] || [];
    if (!choices.length) continue;
    const group = el('div', { class: 'option-group' }, [
      el('h3', { text: title }),
      el('p', { text: description }),
    ]);
    for (const option of choices) {
      const selected = preferences[field] === option.id;
      const input = el('input', { type: 'radio', name: field });
      input.checked = selected;
      const label = el('label', { class: 'option', 'data-selected': String(selected) }, [
        input,
        el('div', {}, [
          el('div', { class: 'label' }, [
            document.createTextNode(option.label || option.id),
            option.recommended ? el('span', { class: 'flag', text: 'recomendada' }) : null,
            option.requires_confirmation ? el('span', { class: 'flag warn', text: 'sin protección' }) : null,
            option.requires_context7_key && context7State && !context7State.api_key_available
              ? el('span', { class: 'flag warn', text: 'falta la key' }) : null,
          ]),
          option.description ? el('div', { class: 'desc', text: option.description }) : null,
        ]),
      ]);
      input.addEventListener('change', () => savePreference(field, option.id, option, group));
      group.append(label);
    }
    const note = field === 'context_mode' ? context7Note(preferences)
      : field === 'safety_mode' ? safetyNote(preferences)
      : null;
    if (note) group.append(note);
    host.append(group);
  }
  renderProfiles(host, workbench);
  renderPhases(host, workbench);
  renderAgents(host, preferences);
  host.append(el('p', {
    class: 'action-hint',
    text: 'La confianza del workspace, las claves y la configuración global del router se cambian desde la CLI: no se editan desde el navegador.',
  }));
}

// Attaching context is a pointer, not an upload: the task carries paths and the
// agent reads them itself, inside the workspace it was already authorized for.
//
// The three regions redraw independently on purpose. Ticking a file must not
// rebuild the list you are scrolling, and typing a filter must not rebuild the
// input you are typing into.
function attachControl(draftKey) {
  const selected = attachments.get(draftKey) || new Set();
  attachments.set(draftKey, selected);
  const state = pickerState.get(draftKey) || { open: false, filter: '' };
  pickerState.set(draftKey, state);

  const chipBar = el('div', { class: 'attach-bar' });
  const toggle = el('button', { class: 'ghost', type: 'button' });
  const panelHost = el('div', {});
  const host = el('div', { class: 'attach' }, [
    chipBar,
    el('div', { class: 'attach-bar' }, [toggle]),
    panelHost,
  ]);

  const list = el('ul', { class: 'entries' });
  const note = el('p', { class: 'composer-hint' });
  const filter = el('input', {
    class: 'filter', type: 'search', 'aria-label': 'Filtrar contexto',
    placeholder: 'Filtrar archivos y carpetas…',
  });

  function drawChips() {
    toggle.textContent = selected.size ? `Contexto (${selected.size})` : 'Adjuntar contexto';
    toggle.setAttribute('aria-expanded', String(state.open));
    chipBar.replaceChildren();
    for (const path of [...selected].sort()) {
      const remove = el('button', { type: 'button', 'aria-label': 'Quitar ' + path, text: '✕' });
      remove.addEventListener('click', () => {
        selected.delete(path);
        drawChips();
        drawEntries();
      });
      chipBar.append(el('span', { class: 'chip', title: path }, [
        el('span', { class: 'name', text: path }),
        remove,
      ]));
    }
  }

  function drawEntries() {
    list.replaceChildren();
    const entries = (contextListing && contextListing.entries) || [];
    const needle = state.filter.trim().toLowerCase();
    const matches = needle
      ? entries.filter((entry) => entry.path.toLowerCase().includes(needle))
      : entries;
    for (const entry of matches.slice(0, ENTRY_ROWS)) {
      const box = el('input', { type: 'checkbox' });
      box.checked = selected.has(entry.path);
      box.addEventListener('change', () => {
        if (box.checked) {
          if (selected.size >= maxAttachments()) {
            box.checked = false;
            note.textContent = `Podés adjuntar hasta ${maxAttachments()} rutas.`;
            return;
          }
          selected.add(entry.path);
        } else {
          selected.delete(entry.path);
        }
        // Only the chips change; the list keeps its scroll and the filter its focus.
        drawChips();
      });
      const isDirectory = entry.kind === 'directory';
      const meta = isDirectory
        ? `${entry.file_count} archivo${entry.file_count === 1 ? '' : 's'}`
        : [entry.language, sizeLabel(entry.bytes)].filter(Boolean).join(' · ');
      list.append(el('li', {}, [el('label', {}, [
        box,
        el('span', {
          class: isDirectory ? 'path dir' : 'path',
          text: isDirectory ? entry.path + '/' : entry.path,
          title: entry.path,
        }),
        meta ? el('span', { class: 'meta', text: meta }) : null,
      ])]));
    }
    if (contextLoading) note.textContent = 'Leyendo el workspace…';
    else if (contextError) note.textContent = 'No se pudo leer el workspace: ' + contextError;
    else if (!entries.length) note.textContent = 'No hay nada para adjuntar en este workspace.';
    else if (!matches.length) note.textContent = 'Ningún archivo coincide con ese filtro.';
    else {
      const extra = matches.length > ENTRY_ROWS
        ? ` · mostrando ${ENTRY_ROWS}, seguí filtrando para ver el resto`
        : '';
      const truncated = contextListing && contextListing.truncated
        ? ' · el repositorio es grande y la lista está recortada'
        : '';
      note.textContent = `${matches.length} de ${entries.length}${extra}${truncated}`;
    }
  }

  function drawPanel() {
    panelHost.replaceChildren();
    if (!state.open) return;
    filter.value = state.filter;
    panelHost.append(el('div', { class: 'picker-panel' }, [filter, list, note]));
    drawEntries();
  }

  filter.addEventListener('input', () => {
    state.filter = filter.value;
    drawEntries();
  });

  toggle.addEventListener('click', async () => {
    state.open = !state.open;
    drawChips();
    drawPanel();
    if (!state.open) return;
    await loadContext(false);
    // The panel may have been closed again while the listing was in flight.
    if (state.open) drawEntries();
  });

  drawChips();
  drawPanel();
  return host;
}

// The composer is the same control in two places: at the top it starts a new
// task, inside a finished item it adds a durable turn to that one. There is no
// separate idea of a conversation, because the item already is one.
function composer({ itemId, placeholder, submitLabel, hint }) {
  // The view re-renders every few seconds, so an unsent draft has to outlive
  // its textarea or it would vanish mid-sentence.
  const draftKey = itemId || 'new';
  const textarea = el('textarea', { rows: '2', placeholder, 'aria-label': placeholder });
  textarea.value = drafts.get(draftKey) || '';
  textarea.addEventListener('input', () => drafts.set(draftKey, textarea.value));
  const button = el('button', { type: 'button', text: submitLabel });
  const box = el('div', {}, [
    el('div', { class: 'composer' }, [textarea, button]),
    hint ? el('p', { class: 'composer-hint', text: hint }) : null,
    attachControl(draftKey),
  ]);

  async function send() {
    const task = textarea.value.trim();
    if (!task) { textarea.focus(); return; }
    const existing = box.querySelector('.action-error');
    if (existing) existing.remove();
    button.disabled = true;
    textarea.disabled = true;
    const attached = [...(attachments.get(draftKey) || [])];
    try {
      const response = await fetch(new URL('/v1/compose', location.origin), {
        method: 'POST',
        credentials: 'omit',
        headers: { 'Content-Type': 'application/json', [TOKEN_HEADER]: token },
        body: JSON.stringify(scoped({
          task,
          ...(itemId ? { work_item_id: itemId } : {}),
          ...(attached.length ? { attachments: attached } : {}),
        })),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.ok === false) {
        const detail = (payload.error && payload.error.message) || ('HTTP ' + response.status);
        box.append(el('div', { class: 'action-error', text: 'No se pudo enviar: ' + detail }));
        return;
      }
      textarea.value = '';
      drafts.delete(draftKey);
      attachments.delete(draftKey);
      pickerState.delete(draftKey);
      if (payload.work_item_id) {
        selectedId = payload.work_item_id;
        const url = new URL(location.href);
        url.searchParams.set('work_item_id', selectedId);
        history.replaceState(null, '', url);
      }
      await refresh();
    } catch (error) {
      box.append(el('div', { class: 'action-error', text: 'No se pudo enviar: ' + error.message }));
    } finally {
      button.disabled = false;
      textarea.disabled = false;
    }
  }

  button.addEventListener('click', send);
  textarea.addEventListener('keydown', (event) => {
    // Enter sends; a newline needs the modifier, as in every chat.
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }
  });
  return box;
}

function renderNewTask() {
  const host = document.getElementById('new-task');
  // Rebuilding this on every poll would fight whoever is typing in it.
  if (host.dataset.ready === String(canCompose)) return;
  host.dataset.ready = String(canCompose);
  host.replaceChildren();
  if (!canCompose) {
    host.append(el('p', {
      class: 'composer-hint',
      text: 'Arrancá la consola con --workspace-root para crear tareas desde acá.',
    }));
    return;
  }
  host.append(composer({
    placeholder: 'Pedile algo a Baldr…',
    submitLabel: 'Empezar',
    hint: 'Usa la configuración de este workspace. Enter envía, Shift+Enter agrega una línea.',
  }));
}

// The page is re-read from disk on every request; the routes are not, because
// they live in the running process. So editing the console and refreshing the
// browser can leave a page asking for something its router does not serve yet,
// and the honest answer is "restart", not "unknown route".
const NEEDED_ROUTES = [
  '/v1/workbench', '/v1/context', '/v1/agents',
  '/v1/actions', '/v1/preferences', '/v1/compose',
  '/v1/providers', '/v1/profiles', '/v1/agent-draft',
];

function checkRouterIsCurrent(routes) {
  const banner = document.getElementById('stale-router');
  // A router old enough not to publish its routes is old enough to warn about.
  const missing = Array.isArray(routes)
    ? NEEDED_ROUTES.filter((route) => !routes.includes(route))
    : NEEDED_ROUTES;
  banner.hidden = missing.length === 0;
  if (missing.length) {
    banner.textContent = 'Esta página es más nueva que el router que la sirve, '
      + 'así que algunas secciones no van a funcionar. Reiniciá la consola (make up). '
      + 'Falta: ' + missing.join(', ');
  }
}

// The agents page is where somebody works out what an agent should be allowed
// to do. Where that decision lives is the file in their repository, so this
// screen writes nothing: it answers, and hands back the block to commit.
const draft = {
  ref: 'local://equipo/revisor@1.0.0',
  owner: '',
  description: '',
  roles: new Set(['reviewer']),
  can_write: false,
  provider: '',
  model: '',
  tools: 'Read,Grep',
  instructions: '',
};
let draftAnswer = null;
let draftPending = null;

function draftDeclaration() {
  const capabilities = ['workspace.read'];
  if (draft.can_write) capabilities.push('workspace.write');
  for (const role of ['architect', 'implementer', 'reviewer']) {
    if (draft.roles.has(role)) capabilities.push('role.' + role);
  }
  const entry = {
    ref: draft.ref.trim(),
    owner: draft.owner.trim(),
    description: draft.description.trim(),
    capabilities,
    effect_mode: draft.can_write ? 'workspace-write' : 'read-only',
    provider: draft.provider,
  };
  for (const key of ['model', 'tools', 'instructions']) {
    if (draft[key].trim()) entry[key] = draft[key].trim();
  }
  return entry;
}

async function askAboutDraft() {
  try {
    const response = await fetch(new URL('/v1/agent-draft', location.origin), {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'application/json', [TOKEN_HEADER]: token },
      body: JSON.stringify(draftDeclaration()),
    });
    const payload = await response.json().catch(() => ({}));
    draftAnswer = response.ok ? payload
      : { valid: false, errors: [(payload.error && payload.error.message) || ('HTTP ' + response.status)] };
  } catch (error) {
    draftAnswer = { valid: false, errors: [error.message] };
  }
  renderDraftAnswer();
}

// Typing should not ask on every keystroke, and should not make somebody wait
// for a pause they did not know to take.
function draftChanged() {
  if (draftPending) clearTimeout(draftPending);
  draftPending = setTimeout(askAboutDraft, 350);
}

function renderDraftAnswer() {
  const host = document.getElementById('draft-answer');
  if (!host) return;
  host.replaceChildren();
  const answer = draftAnswer;
  if (!answer) return;
  if (!answer.valid) {
    for (const message of answer.errors || []) {
      host.append(el('p', { class: 'action-error', text: message }));
    }
    return;
  }
  const effect = answer.effect || {};

  const verdict = el('div', { class: 'verdict' });
  for (const entry of effect.roles || []) {
    verdict.append(el('span', {
      class: 'tag ' + (entry.eligible ? 'yes' : 'no'),
      title: entry.reason || '',
      text: (entry.eligible ? '✓ ' : '✗ ') + (STAGE_LABELS[entry.role] || entry.role),
    }));
  }
  host.append(el('p', { class: 'field', text: 'Sirve para' }), verdict);
  const unusable = (effect.roles || []).filter((entry) => !entry.eligible && entry.reason);
  for (const entry of unusable) {
    host.append(el('p', { class: 'role-desc', text: `${STAGE_LABELS[entry.role] || entry.role}: ${entry.reason}` }));
  }

  if (effect.declared_tools) {
    if (!effect.tools_honored) {
      host.append(el('p', {
        class: 'notice',
        text: `El proveedor «${effect.provider}» ignora la lista de herramientas: la restricción no haría nada. `
          + 'Hoy sólo Claude la aplica.',
      }));
    } else {
      const tools = el('div', { class: 'verdict' });
      for (const name of effect.allowed_tools || []) {
        tools.append(el('span', { class: 'tag yes', text: '✓ ' + name }));
      }
      for (const name of effect.refused_tools || []) {
        tools.append(el('span', { class: 'tag warn', title: 'No se otorga en una fase de solo lectura', text: '✗ ' + name }));
      }
      host.append(el('p', { class: 'field', text: 'Herramientas' }), tools);
      if ((effect.refused_tools || []).length) {
        host.append(el('p', {
          class: 'role-desc',
          text: 'Las tachadas no se otorgan: una fase que no escribe no recibe herramientas que puedan escribir.',
        }));
      }
    }
  }

  host.append(el('p', { class: 'field', text: 'Para pegar en baldr-agents.toml' }));
  const block = el('pre', { class: 'block', text: answer.toml });
  host.append(block);
  const copy = el('button', { class: 'ghost', type: 'button', text: 'Copiar' });
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(answer.toml);
      copy.textContent = 'Copiado';
      setTimeout(() => { copy.textContent = 'Copiar'; }, 1500);
    } catch (_) {
      // Clipboard access can be refused; selecting it is still a way to copy.
      const range = document.createRange();
      range.selectNodeContents(block);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      copy.textContent = 'Seleccionado, copiá con Ctrl-C';
    }
  });
  host.append(el('div', { class: 'actions' }, [copy]));
  host.append(el('p', {
    class: 'action-hint',
    text: `Identidad: ${answer.digest.slice(0, 23)}… · después: make agents para ver el plan, make agents-apply para aplicarlo.`,
  }));
}

const STAGE_LABELS = { architect: 'Planificación', implementer: 'Ejecución', reviewer: 'Revisión' };

function textField(label, key, { placeholder = '', area = false } = {}) {
  const input = area
    ? el('textarea', { class: 'field-input', rows: '3', placeholder, 'aria-label': label })
    : el('input', { class: 'filter', type: 'text', placeholder, 'aria-label': label });
  input.value = draft[key];
  input.addEventListener('input', () => { draft[key] = input.value; draftChanged(); });
  return el('div', {}, [el('label', { class: 'field', text: label }), input]);
}

function renderAgentsPage() {
  const host = document.getElementById('agents-page');
  if (host.dataset.ready === 'yes') return;
  host.dataset.ready = 'yes';
  host.replaceChildren();

  // What the machine already has.
  const known = el('div', { class: 'option-group' }, [
    el('h3', { text: 'Agentes registrados' }),
    el('p', { text: 'El catálogo de esta máquina. Las etapas eligen entre estos.' }),
  ]);
  const state = agentsState;
  if (!state) {
    known.append(el('p', { class: 'action-hint', text: 'Leyendo el catálogo…' }));
  } else if (!state.agent_count) {
    known.append(el('p', { class: 'action-hint', text: 'Todavía no hay ninguno. Declará el primero acá abajo.' }));
  } else {
    const seen = new Set();
    for (const entry of (state.roles || {}).architect || []) seen.add(entry.ref);
    for (const role of ['implementer', 'reviewer']) {
      for (const entry of (state.roles || {})[role] || []) seen.add(entry.ref);
    }
    for (const ref of [...seen].sort()) {
      known.append(el('div', { class: 'phase' }, [el('h4', { text: ref })]));
    }
  }
  host.append(known);

  const group = el('div', { class: 'option-group' }, [
    el('h3', { text: 'Declarar un agente' }),
    el('p', { text: 'Un agente que es pura configuración: sin código, sin build. Acá lo pensás; vive en el archivo de tu repositorio.' }),
  ]);

  const refField = textField('Referencia', 'ref', { placeholder: 'local://equipo/nombre@1.0.0' });
  group.append(refField);
  group.append(el('p', {
    class: 'role-desc',
    text: 'La versión es parte de la identidad y es inmutable: cambiar lo que el agente puede tocar es publicar una versión nueva.',
  }));
  group.append(el('div', { class: 'field-row' }, [
    textField('Dueño', 'owner', { placeholder: 'equipo-plataforma' }),
    textField('Descripción', 'description', { placeholder: 'Para qué sirve' }),
  ]));

  const roleBox = el('div', { class: 'fallbacks' });
  for (const [role, label] of Object.entries(STAGE_LABELS)) {
    const box = el('input', { type: 'checkbox' });
    box.checked = draft.roles.has(role);
    box.addEventListener('change', () => {
      if (box.checked) draft.roles.add(role); else draft.roles.delete(role);
      draftChanged();
    });
    roleBox.append(el('label', {}, [box, el('span', { text: label })]));
  }
  group.append(el('label', { class: 'field', text: 'Etapas que puede cubrir' }), roleBox);

  const write = el('input', { type: 'checkbox' });
  write.checked = draft.can_write;
  write.addEventListener('change', () => { draft.can_write = write.checked; draftChanged(); });
  group.append(el('div', { class: 'fallbacks', style: 'margin-top:8px' }, [
    el('label', {}, [write, el('span', { text: 'Puede modificar el workspace' })]),
  ]));
  group.append(el('p', {
    class: 'role-desc',
    text: 'Sin esto el agente es de solo lectura, que es lo que hace falta para planificar y revisar.',
  }));

  const providerSelect = el('select', { 'aria-label': 'Proveedor' });
  const syncProviders = () => {
    const providers = (providersState && providersState.providers) || [];
    providerSelect.replaceChildren();
    for (const provider of providers) {
      providerSelect.append(el('option', {
        value: provider.id,
        text: provider.available ? provider.id : `${provider.id} (no disponible)`,
      }));
    }
    if (!draft.provider) draft.provider = (providersState && providersState.default_provider) || (providers[0] || {}).id || '';
    providerSelect.value = draft.provider;
  };
  providerSelect.addEventListener('change', () => { draft.provider = providerSelect.value; draftChanged(); });
  group.append(el('label', { class: 'field', text: 'Proveedor' }), providerSelect);
  group.append(el('div', { class: 'field-row' }, [
    textField('Modelo', 'model', { placeholder: 'opus' }),
    textField('Herramientas', 'tools', { placeholder: 'Read,Grep' }),
  ]));
  group.append(textField('Instrucciones', 'instructions', {
    placeholder: 'Cómo tiene que trabajar este agente', area: true,
  }));
  group.append(el('div', { id: 'draft-answer' }));
  host.append(group);

  loadProviders(false).then(() => { syncProviders(); draftChanged(); });
  syncProviders();
  askAboutDraft();
}

function showView(name) {
  for (const view of ['tasks', 'settings', 'agents']) {
    document.getElementById('view-' + view).hidden = view !== name;
  }
  for (const button of document.querySelectorAll('#tabs button')) {
    button.setAttribute('aria-selected', String(button.dataset.view === name));
  }
  // Both catalogs are read on arrival rather than with every poll, so a tab
  // asks for what it needs and redraws once it lands.
  if (name === 'settings') {
    loadAgents(false).then(() => renderSettings(lastWorkbench, true));
    loadProviders(false).then(() => renderSettings(lastWorkbench, true));
  }
  if (name === 'agents') {
    renderAgentsPage();
    loadAgents(false).then(() => {
      document.getElementById('agents-page').dataset.ready = '';
      renderAgentsPage();
    });
  }
}

async function refresh() {
  const foot = document.getElementById('foot');
  try {
    const url = new URL('/v1/workbench', location.origin);
    if (selectedId) url.searchParams.set('work_item_id', selectedId);
    if (workspaceRoot) url.searchParams.set('workspace_root', workspaceRoot);
    const response = await fetch(url, {
      headers: { Accept: 'application/json', [TOKEN_HEADER]: token },
      // No cookie is ever set, so nothing must be sent ambiently either.
      credentials: 'omit',
    });
    if (response.status === 401 || response.status === 403) {
      renderLocked();
      foot.className = 'foot stale';
      foot.textContent = 'Sesión no autorizada.';
      return;
    }
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const payload = await response.json();
    const workbench = payload.workbench || {};
    context7State = payload.context7 || null;
    workspaceState = payload.workspace_state || null;
    checkRouterIsCurrent(payload.routes);
    document.getElementById('scope').textContent = workbench.items && workbench.items.length
      ? 'tareas durables' : '';
    renderCounts(workbench.counts, workbench.total);
    renderItems(workbench.items || []);
    // Before the detail renders, not after: the composer it may show depends on
    // this, and reading last poll's value delayed it by a whole refresh.
    canCompose = Boolean(workbench.preferences);
    renderDetail(workbench.selected, workbench.selected_error);
    lastWorkbench = workbench;
    renderWorkspaces(payload.workspaces || [], payload.workspace_locked);
    renderNewTask();
    renderSettings(workbench);
    announce(workbench.items || []);
    foot.className = 'foot';
    foot.textContent = 'Actualizado ' + new Date().toLocaleTimeString()
      + ' · contrato ' + (payload.contract_version || '?');
  } catch (error) {
    foot.className = 'foot stale';
    foot.textContent = 'Sin contacto con el router (' + error.message + '). Reintentando…';
  }
}

function schedule() {
  if (timer) clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
}

// Permission is requested from a click, never on load: browsers reject and
// penalise an unprompted request, and so would anyone reading this page.
function setUpNotifications() {
  const button = document.getElementById('notify');
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') { notified = true; return; }
  if (Notification.permission === 'denied') return;
  button.hidden = false;
  button.addEventListener('click', async () => {
    const result = await Notification.requestPermission();
    notified = result === 'granted';
    button.hidden = notified;
  });
}

if ('serviceWorker' in navigator) {
  // Registration is what makes the console installable as its own window; the
  // worker deliberately caches nothing.
  navigator.serviceWorker.register('./sw.js').catch(() => { /* not installable */ });
}

for (const button of document.querySelectorAll('#tabs button')) {
  button.addEventListener('click', () => showView(button.dataset.view));
}

document.getElementById('workspace').addEventListener('change', (event) => {
  workspaceRoot = event.target.value;
  // Changing workspace changes which items exist, so the selection cannot
  // survive the switch. Neither can attached paths: they named files in the
  // repository being left behind.
  selectedId = null;
  contextListing = null;
  contextError = '';
  attachments.clear();
  pickerState.clear();
  document.getElementById('detail').dataset.signature = '';
  document.getElementById('new-task').dataset.ready = '';
  const url = new URL(location.href);
  url.searchParams.delete('work_item_id');
  if (workspaceRoot) url.searchParams.set('workspace_root', workspaceRoot);
  else url.searchParams.delete('workspace_root');
  history.replaceState(null, '', url);
  refresh();
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setUpNotifications();
refresh();
schedule();
</script>
</body>
