[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baldr-kiro-adapter"
version = "0.20.1"
description = "Optional Kiro client adapter for the client-agnostic baldr-router MCP runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Baldr" }]
dependencies = [
  "baldr-router>=0.20.1,<0.21.0",
  # Same cap as the router: mcp 2.x is a breaking rename of the server API.
  "mcp>=1.10.0,<2"
]

[project.scripts]
baldr-kiro-adapter = "baldr_kiro_adapter.cli:main"

[project.entry-points."baldr_router.extensions"]
kiro = "baldr_kiro_adapter.extension:register"

[tool.hatch.build.targets.wheel]
packages = ["src/baldr_kiro_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../../router/src"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9,<0.16"]

[tool.uv.sources]
baldr-router = { workspace = true }
